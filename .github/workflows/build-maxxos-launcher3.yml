#
# Launcher3 is an Android Soong module, not a standalone Gradle project.
# The actual APK must be built from the complete MaxxOS/AOSP tree with:
#   m Launcher3
# or:
#   m Launcher3QuickStep

name: Validate MaxxOS Launcher3

on:
  workflow_dispatch:
  push:
    branches: [ staging ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Launcher3 source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Launcher3 Soong files
        run: |
          set -euo pipefail

          test -f Android.bp
          test -f AndroidManifest-common.xml
          test -f src/com/android/launcher3/Hotseat.java
          test -f src/com/android/launcher3/Launcher.java
          test -f src/com/android/launcher3/Utilities.java
          test -f src/com/android/launcher3/qsb/MaxxQsbView.java
          test -f res/drawable/maxx_ios27_dock_background.xml
          test -f MAXXOS_IOS27_DOCK.md

          echo "Launcher3 source files are present."

      - name: Validate XML resources
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          roots = [
              pathlib.Path("res"),
              pathlib.Path("quickstep/res"),
              pathlib.Path("go/quickstep/res"),
          ]

          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob("*.xml"))

          errors = []

          for path in files:
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print(f"Validated {len(files)} XML resource files.")
          PY

      - name: Validate MaxxOS Java files
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("src/com/android/launcher3/Hotseat.java"),
              Path("src/com/android/launcher3/Launcher.java"),
              Path("src/com/android/launcher3/Utilities.java"),
              Path("src/com/android/launcher3/qsb/MaxxQsbView.java"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")

              if not text.strip():
                  raise SystemExit(f"{path}: file is empty")

              if text.count("{") != text.count("}"):
                  raise SystemExit(f"{path}: unmatched braces")

              if "package " not in text:
                  raise SystemExit(f"{path}: package declaration missing")

              print(f"OK: {path}")
          PY

      - name: Check for accidental build artifacts
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o \
              \( -name '*.apk' -o -name '*.aab' -o -name '*.class' \) \
              -print | grep -q .; then
            echo "Unexpected generated build artifacts found."
            exit 1
          fi

          echo "No generated APK/AAB/class artifacts committed."

      - name: Show Launcher3 build targets
        run: |
          grep -nE \
            'name: "(Launcher3|Launcher3QuickStep|Launcher3Go|Launcher3QuickStepGo)"' \
            Android.bp || true

          echo
          echo "This repository uses Android Soong, not Gradle."
